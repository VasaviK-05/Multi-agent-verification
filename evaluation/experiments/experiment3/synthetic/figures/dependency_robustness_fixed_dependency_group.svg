<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460"><rect width="100%" height="100%" fill="white"/><text x="24" y="28" font-size="18">Synthetic dependency robustness (Fixed dependency-group)</text><text x="24" y="50" font-size="12">Rows are dependency assumptions. Columns are attack conditions. Cells are validation loss. SYNTHETIC fixture, not measured dependence.</text><text x="430" y="78" font-size="13">Attack condition</text><text x="18" y="230" font-size="13" transform="rotate(-90 18 230)">Dependency assumption</text><text x="250" y="100" font-size="12">Clean</text><text x="420" y="100" font-size="12">Forced support</text><text x="590" y="100" font-size="12">Forced rejection</text><text x="760" y="100" font-size="12">Confidence inflation</text><text x="36" y="150" font-size="12">Independent verifiers</text><rect x="250" y="112" width="150" height="64" fill="rgb(237,229,226)" stroke="#1b4f72"/><text x="260" y="140" font-size="16">0.200</text><text x="260" y="160" font-size="11">worst of 1 group(s)</text><rect x="420" y="112" width="150" height="64" fill="rgb(237,229,226)" stroke="#1b4f72"/><text x="430" y="140" font-size="16">0.200</text><text x="430" y="160" font-size="11">worst of 4 group(s)</text><rect x="590" y="112" width="150" height="64" fill="rgb(219,213,222)" stroke="#1b4f72"/><text x="600" y="140" font-size="16">0.300</text><text x="600" y="160" font-size="11">worst of 4 group(s)</text><rect x="760" y="112" width="150" height="64" fill="rgb(237,229,226)" stroke="#1b4f72"/><text x="770" y="140" font-size="16">0.200</text><text x="770" y="160" font-size="11">worst of 4 group(s)</text><text x="36" y="240" font-size="12">Semantic + evidence correlated</text><rect x="250" y="202" width="150" height="64" fill="rgb(237,229,226)" stroke="#1b4f72"/><text x="260" y="230" font-size="16">0.200</text><text x="260" y="250" font-size="11">worst of 1 group(s)</text><rect x="420" y="202" width="150" height="64" fill="rgb(237,229,226)" stroke="#1b4f72"/><text x="430" y="230" font-size="16">0.200</text><text x="430" y="250" font-size="11">worst of 3 group(s)</text><rect x="590" y="202" width="150" height="64" fill="rgb(213,207,220)" stroke="#1b4f72"/><text x="600" y="230" font-size="16">0.333</text><text x="600" y="250" font-size="11">worst of 3 group(s)</text><rect x="760" y="202" width="150" height="64" fill="rgb(237,229,226)" stroke="#1b4f72"/><text x="770" y="230" font-size="16">0.200</text><text x="770" y="250" font-size="11">worst of 3 group(s)</text><text x="36" y="330" font-size="12">Fully correlated</text><rect x="250" y="292" width="150" height="64" fill="rgb(255,245,230)" stroke="#1b4f72"/><text x="260" y="320" font-size="16">0.100</text><text x="260" y="340" font-size="11">worst of 1 group(s)</text><rect x="420" y="292" width="150" height="64" fill="rgb(255,245,230)" stroke="#1b4f72"/><text x="430" y="320" font-size="16">0.100</text><text x="430" y="340" font-size="11">worst of 1 group(s)</text><rect x="590" y="292" width="150" height="64" fill="rgb(75,85,190)" stroke="#1b4f72"/><text x="600" y="320" font-size="16">1.100</text><text x="600" y="340" font-size="11">worst of 1 group(s)</text><rect x="760" y="292" width="150" height="64" fill="rgb(255,245,230)" stroke="#1b4f72"/><text x="770" y="320" font-size="16">0.100</text><text x="770" y="340" font-size="11">worst of 1 group(s)</text><text x="24" y="420" font-size="12">Validation loss is the game mean loss: decision loss plus 0.1 times estimated attempt cost. A cell with several groups uses the worst group.</text><text x="24" y="442" font-size="12">SYNTHETIC. One hand-built example. This does not estimate Development robustness.</text><desc>SYNTHETIC</desc></svg>