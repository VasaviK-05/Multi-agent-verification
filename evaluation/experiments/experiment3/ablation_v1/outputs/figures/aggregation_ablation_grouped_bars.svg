<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="100%" height="100%" fill="white"/><text x="28" y="28" font-size="18" font-family="Cambria, serif">Aggregation ablation on the preserved Development reports</text><text x="28" y="50" font-size="12" font-family="Calibri, sans-serif" fill="#333">744 candidates, 372 question groups. Neutral Beta(1, 1) reputation. The non-neutral panel is not estimable.</text><text x="28" y="80" font-size="14" font-family="Calibri, sans-serif">Mean decision loss</text><line x1="70" y1="110" x2="70" y2="250" stroke="#222"/><line x1="70" y1="250" x2="620" y2="250" stroke="#222"/><rect x="110" y="161.3" width="70" height="88.7" fill="#1b4f72"/><text x="110" y="268" font-size="11" font-family="Calibri, sans-serif">Joint game</text><text x="110" y="155.3" font-size="11" font-family="Calibri, sans-serif">0.253303</text><rect x="260" y="161.3" width="70" height="88.7" fill="#b9770e"/><text x="260" y="268" font-size="11" font-family="Calibri, sans-serif">Reputation only</text><text x="260" y="155.3" font-size="11" font-family="Calibri, sans-serif">0.253303</text><rect x="410" y="161.3" width="70" height="88.7" fill="#196f3d"/><text x="410" y="268" font-size="11" font-family="Calibri, sans-serif">Dependency only</text><text x="410" y="155.3" font-size="11" font-family="Calibri, sans-serif">0.253303</text><text x="640" y="160" font-size="12" font-family="Calibri, sans-serif">Decision loss excludes the resource penalty. Lower is better.</text><text x="640" y="180" font-size="12" font-family="Calibri, sans-serif">Exactly tied. Paired loss interval [0, 0].</text><text x="28" y="300" font-size="14" font-family="Calibri, sans-serif">Decision coverage</text><line x1="70" y1="330" x2="70" y2="470" stroke="#222"/><line x1="70" y1="470" x2="620" y2="470" stroke="#222"/><rect x="110" y="436.7" width="70" height="33.3" fill="#1b4f72"/><text x="110" y="488" font-size="11" font-family="Calibri, sans-serif">Joint game</text><text x="110" y="430.7" font-size="11" font-family="Calibri, sans-serif">0.237519</text><rect x="260" y="436.7" width="70" height="33.3" fill="#b9770e"/><text x="260" y="488" font-size="11" font-family="Calibri, sans-serif">Reputation only</text><text x="260" y="430.7" font-size="11" font-family="Calibri, sans-serif">0.237519</text><rect x="410" y="436.7" width="70" height="33.3" fill="#196f3d"/><text x="410" y="488" font-size="11" font-family="Calibri, sans-serif">Dependency only</text><text x="410" y="430.7" font-size="11" font-family="Calibri, sans-serif">0.237519</text><text x="640" y="380" font-size="12" font-family="Calibri, sans-serif">Coverage is the share of candidates with a passed or failed decision.</text><text x="640" y="400" font-size="12" font-family="Calibri, sans-serif">Exactly tied. No coverage interval was calculated.</text><text x="28" y="520" font-size="12" font-family="Calibri, sans-serif">Non-neutral reputation: not_estimable. No approved non-neutral reputation snapshot exists. Development outcomes are excluded as a reputation source, observations_count is 0, and the update rule is not approved. No substitute reputations were invented.</text><text x="28" y="542" font-size="12" font-family="Calibri, sans-serif">No confidence interval is drawn for a reputation snapshot that was not run.</text></svg>