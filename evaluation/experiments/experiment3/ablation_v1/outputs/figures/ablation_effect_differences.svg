<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="100%" height="100%" fill="white"/><text x="24" y="28" font-size="18" font-family="Cambria, serif">Paired loss differences</text><text x="24" y="50" font-size="12" font-family="Calibri, sans-serif" fill="#333">Positive means the named method has higher decision loss than the reference. The horizontal line is zero.</text><line x1="80" y1="250" x2="1040" y2="250" stroke="#222"/><text x="1048" y="254" font-size="12" font-family="Calibri, sans-serif">0</text><line x1="120" y1="250.0" x2="120" y2="250.0" stroke="#1b4f72" stroke-width="2"/><circle cx="120" cy="250.0" r="5" fill="#1b4f72"/><text x="65" y="290" font-size="10" font-family="Calibri, sans-serif">fixed_reputation_weighted minus joint</text><text x="65" y="306" font-size="10" font-family="Calibri, sans-serif">mean=0.0000</text><text x="65" y="322" font-size="10" font-family="Calibri, sans-serif">[0.0000, 0.0000]</text><text x="65" y="338" font-size="10" font-family="Calibri, sans-serif">zero groups=372</text><line x1="280" y1="250.0" x2="280" y2="250.0" stroke="#1b4f72" stroke-width="2"/><circle cx="280" cy="250.0" r="5" fill="#1b4f72"/><text x="225" y="290" font-size="10" font-family="Calibri, sans-serif">fixed_dependency_group minus joint</text><text x="225" y="306" font-size="10" font-family="Calibri, sans-serif">mean=0.0000</text><text x="225" y="322" font-size="10" font-family="Calibri, sans-serif">[0.0000, 0.0000]</text><text x="225" y="338" font-size="10" font-family="Calibri, sans-serif">zero groups=372</text><line x1="440" y1="250.0" x2="440" y2="250.0" stroke="#1b4f72" stroke-width="2"/><circle cx="440" cy="250.0" r="5" fill="#1b4f72"/><text x="385" y="290" font-size="10" font-family="Calibri, sans-serif">independent independent_failures minus declared</text><text x="385" y="306" font-size="10" font-family="Calibri, sans-serif">mean=0.0000</text><text x="385" y="322" font-size="10" font-family="Calibri, sans-serif">[0.0000, 0.0000]</text><text x="385" y="338" font-size="10" font-family="Calibri, sans-serif">zero groups=372</text><line x1="600" y1="250.0" x2="600" y2="250.0" stroke="#1b4f72" stroke-width="2"/><circle cx="600" cy="250.0" r="5" fill="#1b4f72"/><text x="545" y="290" font-size="10" font-family="Calibri, sans-serif">fully_correlated independent_failures minus declared</text><text x="545" y="306" font-size="10" font-family="Calibri, sans-serif">mean=0.0000</text><text x="545" y="322" font-size="10" font-family="Calibri, sans-serif">[0.0000, 0.0000]</text><text x="545" y="338" font-size="10" font-family="Calibri, sans-serif">zero groups=372</text><line x1="760" y1="250.0" x2="760" y2="250.0" stroke="#1b4f72" stroke-width="2"/><circle cx="760" cy="250.0" r="5" fill="#1b4f72"/><text x="705" y="290" font-size="10" font-family="Calibri, sans-serif">independent correlated_failures minus declared</text><text x="705" y="306" font-size="10" font-family="Calibri, sans-serif">mean=0.0000</text><text x="705" y="322" font-size="10" font-family="Calibri, sans-serif">[0.0000, 0.0000]</text><text x="705" y="338" font-size="10" font-family="Calibri, sans-serif">zero groups=372</text><line x1="920" y1="250.0" x2="920" y2="250.0" stroke="#1b4f72" stroke-width="2"/><circle cx="920" cy="250.0" r="5" fill="#1b4f72"/><text x="865" y="290" font-size="10" font-family="Calibri, sans-serif">fully_correlated correlated_failures minus declared</text><text x="865" y="306" font-size="10" font-family="Calibri, sans-serif">mean=0.0000</text><text x="865" y="322" font-size="10" font-family="Calibri, sans-serif">[0.0000, 0.0000]</text><text x="865" y="338" font-size="10" font-family="Calibri, sans-serif">zero groups=372</text><text x="24" y="430" font-size="12" font-family="Calibri, sans-serif">Intervals are 95 percent group bootstraps, 2000 resamples, seed 20261113. Question groups are the resampled units.</text><text x="24" y="452" font-size="12" font-family="Calibri, sans-serif">A zero interval on the neutral aggregation contrasts means every paired difference was zero. It is not a general equivalence result.</text><text x="24" y="474" font-size="12" font-family="Calibri, sans-serif">Dependency contrasts use the matched failure columns. Native correlated columns are not plotted here because their targets differ by assumption.</text></svg>