<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460"><rect width="100%" height="100%" fill="white"/><text x="24" y="28" font-size="18" font-family="Cambria, serif">Dependency robustness: decision coverage on the worst-loss column</text><text x="24" y="50" font-size="12" font-family="Calibri, sans-serif" fill="#333">Rows are dependency assumptions. Columns are failure scenarios. Values come from the completed result file.</text><text x="360" y="90" font-size="13" font-family="Calibri, sans-serif">Independent failures</text><text x="620" y="90" font-size="13" font-family="Calibri, sans-serif">Correlated failures</text><text x="24" y="158" font-size="13" font-family="Calibri, sans-serif">Declared structural</text><rect x="340" y="130" width="220" height="64" fill="#d4e6f1" stroke="#1b4f72"/><text x="352" y="158" font-size="16" font-family="Calibri, sans-serif">0.251344</text><text x="352" y="178" font-size="11" font-family="Calibri, sans-serif">n=744</text><rect x="600" y="130" width="220" height="64" fill="#d4e6f1" stroke="#1b4f72"/><text x="612" y="158" font-size="16" font-family="Calibri, sans-serif">0.251344</text><text x="612" y="178" font-size="11" font-family="Calibri, sans-serif">n=744</text><text x="24" y="248" font-size="13" font-family="Calibri, sans-serif">Independent</text><rect x="340" y="220" width="220" height="64" fill="#d4e6f1" stroke="#1b4f72"/><text x="352" y="248" font-size="16" font-family="Calibri, sans-serif">0.251344</text><text x="352" y="268" font-size="11" font-family="Calibri, sans-serif">n=744</text><rect x="600" y="220" width="220" height="64" fill="#d4e6f1" stroke="#1b4f72"/><text x="612" y="248" font-size="16" font-family="Calibri, sans-serif">0.251344</text><text x="612" y="268" font-size="11" font-family="Calibri, sans-serif">n=744</text><text x="24" y="338" font-size="13" font-family="Calibri, sans-serif">Fully correlated</text><rect x="340" y="310" width="220" height="64" fill="#d4e6f1" stroke="#1b4f72"/><text x="352" y="338" font-size="16" font-family="Calibri, sans-serif">0.251344</text><text x="352" y="358" font-size="11" font-family="Calibri, sans-serif">n=744</text><rect x="600" y="310" width="220" height="64" fill="#d4e6f1" stroke="#1b4f72"/><text x="612" y="338" font-size="16" font-family="Calibri, sans-serif">0.251344</text><text x="612" y="358" font-size="11" font-family="Calibri, sans-serif">n=744</text><text x="24" y="420" font-size="12" font-family="Calibri, sans-serif">Coverage uses the same selected team and the same failure column as the loss heatmap.</text><text x="24" y="442" font-size="12" font-family="Calibri, sans-serif">Controlled failures of the saved Development reports. This is not a measured correlation and not a Final Test result.</text></svg>