ans-serif">HotpotQA support n=168</text><text x="28" y="430" font-size="12" font-family="Calibri, sans-serif">GSM8K classifies 11 clean candidates and 19 under model-component forced support. Those rates are unstable.</text><desc>EMPIRICAL</desc></svg>