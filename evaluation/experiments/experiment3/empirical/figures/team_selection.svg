<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="100%" height="100%" fill="white"/><text x="28" y="28" font-size="18" font-family="Cambria, serif">EMPIRICAL feasible-team worst-case loss</text><text x="28" y="50" font-size="12" font-family="Calibri, sans-serif" fill="#333">Worst attack-column mean of decision loss plus the selected resource penalty. Both aggregations match. Highlighted team is the unique optimum inside each aggregation.</text><rect x="280" y="90" width="339.5" height="28" fill="#1b4f72"/><text x="268" y="109" font-size="13" text-anchor="end" font-family="Calibri, sans-serif">evidence + rule</text><text x="627.5" y="109" font-size="12" font-family="Calibri, sans-serif">0.291</text><rect x="280" y="138" width="347.7" height="28" fill="#85929e"/><text x="268" y="157" font-size="13" text-anchor="end" font-family="Calibri, sans-serif">rule + semantic</text><text x="635.7" y="157" font-size="12" font-family="Calibri, sans-serif">0.298</text><rect x="280" y="186" width="395.4" height="28" fill="#85929e"/><text x="268" y="205" font-size="13" text-anchor="end" font-family="Calibri, sans-serif">evidence + semantic</text><text x="683.4" y="205" font-size="12" font-family="Calibri, sans-serif">0.339</text><rect x="280" y="234" width="396.4" height="28" fill="#85929e"/><text x="268" y="253" font-size="13" text-anchor="end" font-family="Calibri, sans-serif">evidence + rule + semantic</text><text x="684.4" y="253" font-size="12" font-family="Calibri, sans-serif">0.340</text><rect x="280" y="282" width="572.4" height="28" fill="#85929e"/><text x="268" y="301" font-size="13" text-anchor="end" font-family="Calibri, sans-serif">confidence + rule</text><text x="860.4" y="301" font-size="12" font-family="Calibri, sans-serif">0.491</text><rect x="280" y="330" width="636.2" height="28" fill="#85929e"/><text x="268" y="349" font-size="13" text-anchor="end" font-family="Calibri, sans-serif">confidence + semantic</text><text x="924.2" y="349" font-size="12" font-family="Calibri, sans-serif">0.545</text><rect x="280" y="378" width="637.1" height="28" fill="#85929e"/><text x="268" y="397" font-size="13" text-anchor="end" font-family="Calibri, sans-serif">confidence + rule + semantic</text><text x="925.1" y="397" font-size="12" font-family="Calibri, sans-serif">0.546</text><line x1="280" y1="80" x2="280" y2="450" stroke="#222"/><text x="28" y="490" font-size="12" font-family="Calibri, sans-serif">EMPIRICAL scores of every feasible team on the stored reports. Confidence-bearing teams include a penalty near 0.20.</text><desc>EMPIRICAL</desc></svg>