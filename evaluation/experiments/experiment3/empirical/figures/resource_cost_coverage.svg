<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="100%" height="100%" fill="white"/><text x="28" y="28" font-size="18" font-family="Cambria, serif">EMPIRICAL team cost and clean coverage</text><text x="28" y="50" font-size="12" font-family="Calibri, sans-serif" fill="#333">Each point is one feasible team scored on the stored clean reports. X is the frozen-mean team cost, on a log scale. Coverage denominator: 744.</text><line x1="120" y1="80" x2="120" y2="420" stroke="#222"/><line x1="120" y1="420" x2="960" y2="420" stroke="#222"/><text x="112" y="424.0" font-size="11" text-anchor="end" font-family="Calibri, sans-serif">0.00</text><text x="112" y="349.0" font-size="11" text-anchor="end" font-family="Calibri, sans-serif">0.25</text><text x="112" y="274.0" font-size="11" text-anchor="end" font-family="Calibri, sans-serif">0.50</text><text x="112" y="199.0" font-size="11" text-anchor="end" font-family="Calibri, sans-serif">0.75</text><text x="112" y="124.0" font-size="11" text-anchor="end" font-family="Calibri, sans-serif">1.00</text><text x="214.9" y="438" font-size="11" text-anchor="middle" font-family="Calibri, sans-serif">100 ms</text><text x="530.0" y="438" font-size="11" text-anchor="middle" font-family="Calibri, sans-serif">1000 ms</text><text x="845.1" y="438" font-size="11" text-anchor="middle" font-family="Calibri, sans-serif">10000 ms</text><circle cx="225.4" cy="351.9" r="6" fill="#1b4f72"/><text x="233.4" y="343.9" font-size="11" font-family="Calibri, sans-serif">evidence + rule</text><circle cx="167.2" cy="378.1" r="6" fill="#922b21"/><text x="175.2" y="370.1" font-size="11" font-family="Calibri, sans-serif">rule + semantic</text><circle cx="294.1" cy="356.7" r="6" fill="#922b21"/><text x="302.1" y="348.7" font-size="11" font-family="Calibri, sans-serif">evidence + semantic</text><circle cx="294.2" cy="355.9" r="6" fill="#922b21"/><text x="302.2" y="347.9" font-size="11" font-family="Calibri, sans-serif">evidence + rule + semantic</text><circle cx="899.9" cy="344.2" r="6" fill="#922b21"/><text x="907.9" y="336.2" font-size="11" font-family="Calibri, sans-serif">confidence + rule</text><circle cx="900.6" cy="333.3" r="6" fill="#922b21"/><text x="908.6" y="325.3" font-size="11" font-family="Calibri, sans-serif">confidence + semantic</text><circle cx="900.6" cy="332.5" r="6" fill="#922b21"/><text x="908.6" y="324.5" font-size="11" font-family="Calibri, sans-serif">confidence + rule + semantic</text><text x="28" y="470" font-size="12" font-family="Calibri, sans-serif">Blue is the solved team. Red points are other feasible teams, not alternative empirical runs. Dependency-group coverage matches these points.</text><text x="28" y="490" font-size="12" font-family="Calibri, sans-serif">EMPIRICAL. Cost is the frozen calibration sum, not this run's recorded wall time.</text><desc>EMPIRICAL</desc></svg>